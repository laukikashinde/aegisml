global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'aegisml'

rule_files: []

scrape_configs:
  # AegisML Backend — exposes /metrics
  - job_name: 'aegisml-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
