[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisml-backend"
version = "0.1.0"
description = "AegisML Autonomous Self-Healing MLOps Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.28",
    "python-multipart>=0.0.9",
    "httpx>=0.26",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # Validation / serialisation
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",

    # ML
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "joblib>=1.3",

    # MLflow
    "mlflow>=2.10",

    # Monitoring / drift
    "evidently>=0.4",
    "scipy>=1.11",

    # LLM / Agent
    "langchain>=0.1",
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "openai>=1.20",
    "tiktoken>=0.6",

    # Observability
    "prometheus-client>=0.19",
    "structlog>=24.0",

    # Utilities
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "apscheduler>=3.10",
    "tenacity>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.26",
    "factory-boy>=3.3",
    "faker>=25.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
